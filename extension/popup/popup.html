<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syllabus Lens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Syllabus Lens 💬</h1>
        <p>シラバスにみんなの授業アンケートの結果が表示されます</p>
      </header>

      <section class="settings-panel" aria-label="自分の学部">
        <label for="faculty-select">自分の学部</label>
        <select id="faculty-select">
          <option value="">学部を選択してください</option>
        </select>
        <p id="faculty-note">
          自分の学部を選ぶと、その学部の授業評価だけを保存します。
        </p>
      </section>

      <section
        id="login-panel"
        class="login-panel"
        aria-label="K-Supportログイン"
        hidden
      >
        <h2>K-Supportへのログインが必要です</h2>
        <p>評価データを更新するには、K-Supportを開いてログインしてください。</p>
        <button id="open-ksupport" type="button">K-Supportを開く</button>
      </section>

      <section class="progress-panel" aria-label="保存済みデータの状況">
        <div class="progress-head">
          <div>
            <h2>データ更新</h2>
            <p id="progress-stage">確認中</p>
          </div>
          <strong id="progress-percent">-</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <dl class="progress-grid">
          <div>
            <dt>対象授業</dt>
            <dd id="expected-total">-</dd>
          </div>
          <div>
            <dt>見つけた授業</dt>
            <dd id="search-found">-</dd>
          </div>
          <div>
            <dt>保存済み</dt>
            <dd id="detail-progress">- / -</dd>
          </div>
        </dl>
        <p id="progress-note" class="progress-note">
          K-Supportにログインして更新すると、シラバス上で使える評価が保存されます。
        </p>
        <p id="cache-detail" class="cache-detail">保存済み評価 - 件</p>
      </section>

      <button id="sync-all" type="button">評価データを更新</button>
      <button id="force-refresh" class="secondary-button" type="button" hidden>
        すべて再取得
      </button>

      <section
        id="force-confirm"
        class="confirm-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="force-confirm-title"
        hidden
      >
        <h2 id="force-confirm-title">アンケート結果を更新します</h2>
        <p>5〜10分ほど時間がかかる場合があります。</p>
        <div class="confirm-actions">
          <button
            id="force-confirm-cancel"
            class="secondary-button"
            type="button"
          >
            キャンセル
          </button>
          <button id="force-confirm-run" type="button">更新する</button>
        </div>
      </section>
      <p id="debug-message" class="debug-message"></p>
    </main>
    <script src="../src/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
