<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syllabus Lens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Syllabus Lens 💬</h1>
        <p>シラバス一覧で、近くに表示される授業から順に評価を保存します。</p>
      </header>

      <section id="login-panel" class="login-panel" aria-label="K-Supportログイン" hidden>
        <h2>K-Supportへのログインが必要です</h2>
        <p>授業評価を取得するには、K-Supportを開いてログインしてください。</p>
      </section>

      <section class="status-panel" aria-label="使い方">
        <h2 id="status-title">準備を確認中</h2>
        <p id="status-note">
          シラバス一覧を開くと、表示範囲と少し先の授業評価を自動で確認します。
        </p>
      </section>

      <button id="open-ksupport" type="button">K-Supportを開く</button>
      <p id="debug-message" class="debug-message"></p>
    </main>
    <script src="../src/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
